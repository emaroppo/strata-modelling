[project]
name = "strata-modelling"
version = "0.1.0"
description = "Train and predict over a materialised dataset; model plugins, runs and checkpoints"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strata-labels>=0.1,<0.2",
    # The migration plumbing and the entry-point resolver. Its migrations
    # extra is sqlalchemy and alembic, which this package needs anyway.
    "strata-common[migrations]>=0.1,<0.2",
    "sqlalchemy>=2.0",
    # Schema changes are migrations, not create_all: an existing database
    # never gains a column from metadata alone. See strata-modelling-migrate.
    "alembic>=1.13",
]

# The baselines are the only thing here that needs an ML framework, and a
# project bringing its own model needs none of them. Installed per media
# type so a text job does not pull in a vision stack, or the other way round.
[project.optional-dependencies]
image = [
    "Pillow>=10.0",
    "timm>=1.0",
    "torch>=2.0",
    "torchvision>=0.15",
    # The baselines show progress; nothing else here does.
    "rich>=13.0",
]
text = [
    "torch>=2.0",
    "transformers>=4.40",
    "rich>=13.0",
]
all = [
    "strata-modelling[image,text]",
]
# The conformance suite is importable by plugins so they can run the model
# contract against their own model. It is the only thing here needing pytest.
test = ["pytest>=8.0"]
# Only the service layer materialises; the training core takes a directory
# and a manifest, so it stays testable with neither a catalog nor a database.
service = [
    "strata-catalog>=0.1,<0.2",
    "strata-common[service]>=0.1,<0.2",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.scripts]
# Only importable with the service extra; declared here so a host has a
# command rather than a python -c.
strata-modelling = "strata.modelling.remote.service:main"
# Alembic's commands over the migrations this package ships, so a run store
# can be brought up to date from an installed wheel.
strata-modelling-migrate = "strata.modelling.store.schema_version:migrate"
# Looking after a run store: folding one into another.
strata-runs = "strata.modelling.cli:main"

# Short names a request can carry, so a caller need not know an import path.
# Read from what is installed, which is the only honest answer to "what can
# this backend serve".
[project.entry-points."strata.models"]
multilabel = "strata.modelling.baselines.classifier:MultiLabelClassifier"
multiclass = "strata.modelling.baselines.classifier:MulticlassClassifier"
presence = "strata.modelling.baselines.classifier:PresenceClassifier"
text = "strata.modelling.baselines.text.classifier:TextClassifier"
text-multiclass = "strata.modelling.baselines.text.multiclass:TextMulticlassClassifier"
text-span = "strata.modelling.baselines.text.tagger:TextSpanTagger"

[tool.uv.sources]
strata-labels = { workspace = true }
strata-common = { workspace = true }
strata-catalog = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
